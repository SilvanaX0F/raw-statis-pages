<!-- Laporan Donasi Masuk -->
<section class="section" id="laporan-donasi">
  <div class="container">
    <div class="flex-between mb-lg" style="align-items: flex-end; flex-wrap: wrap; gap: 1rem;">

      </div>
    </div>

    <!-- Tombol Filter Kategori -->
    <div class="gallery-filter" id="filter-donasi">
      <button type="button" class="is-active" data-filter="Semua">Semua Donasi</button>
      <button type="button" data-filter="Zakat">Zakat</button>
      <button type="button" data-filter="Infaq">Infaq</button>
      <button type="button" data-filter="Shodaqoh">Shodaqoh</button>
      <button type="button" data-filter="Wakaf">Wakaf</button>
    </div>

    <!-- Tabel -->
    <div class="card" style="overflow-x: auto; padding: 0; border-radius: var(--radius-md); box-shadow: var(--shadow-sm);">

            <th style="padding: 1rem 1.5rem; text-align: center;">Kategori</th>
            <th style="padding: 1rem 1.5rem; text-align: right;">Jumlah (Rp)</th>
          </tr>
        </thead>
        <tbody id="tabel-donasi-body">
          <tr>
            <td colspan="6" style="padding: 3rem; text-align: center; color: var(--muted);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px; margin-bottom: 0.5rem; animation: spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg><br>
              Memuat data donasi dari sistem...
            </td>
          </tr>
        </tbody>
      </table>
      
      <!-- Container untuk Paginasi (Navigasi Halaman) -->
      <div id="pagination-container" style="padding: 1rem 1.5rem; display: flex; justify-content: center; gap: 0.5rem; border-top: 1px solid var(--border); background: var(--white);">

<!-- Tambahan animasi loading putar -->
<style>
  @keyframes spin { 100% { transform: rotate(360deg); } }
  
  /* Styling dasar untuk tombol paginasi */
  .page-btn {
    padding: 0.4rem 0.8rem;
    border: 1px solid var(--border);
    background: var(--white);
    color: var(--secondary);
    border-radius: 4px;
    cursor: pointer;
    font-size: var(--fs-sm);
    font-weight: 600;
    transition: all 0.2s ease;
  }
  
  .page-btn:hover {
    background: var(--light);
    border-color: var(--secondary);
  }
  
  .page-btn.active {
    background: var(--primary);
    color: var(--white);
    border-color: var(--primary);
  }
</style>

<!-- Script penarik data, logika filter, dan Paginasi dari Firebase -->
<script type="module">
  import { db, collection, getDocs, query, orderBy } from './js/firebase-config.js';

  const tbody = document.getElementById('tabel-donasi-body');
  const paginationContainer = document.getElementById('pagination-container');
  const filterButtons = document.querySelectorAll('#filter-donasi button');
  
  let dataDonasiMaster = [];
  let currentFilterData = []; // Menyimpan data yang sedang aktif difilter
  
  // Konfigurasi Paginasi
  let currentPage = 1;
  const itemsPerPage = 10; // Jumlah baris per halaman

  // 1. Load Data dari Firebase (1x panggil)
  async function loadDonasi() {
    try {
      const q = query(collection(db, 'donations'));
      const querySnapshot = await getDocs(q);

      if (querySnapshot.empty) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" style="padding: 3rem 1rem; text-align: center; color: var(--muted);">
              <strong>Belum Ada Data Donasi</strong>
              <p style="font-size: var(--fs-xs); margin-top: 0.25rem;">Saat ini belum ada riwayat donasi masuk yang ditampilkan.</p>
            </td>
          </tr>`;
        paginationContainer.innerHTML = '';
        return;
      }

      dataDonasiMaster = [];
      querySnapshot.forEach((doc) => {
        dataDonasiMaster.push(doc.data());
      });

      // MENGURUTKAN DATA BERDASARKAN TANGGAL (Terbaru ke Terlama)
      dataDonasiMaster.sort((a, b) => {
        const dateA = new Date(a.tanggal);
        const dateB = new Date(b.tanggal);
        return dateB - dateA;
      });

      currentFilterData = [...dataDonasiMaster];
      renderTabel(currentFilterData, currentPage);

    } catch (err) {
      console.error('Error fetching data:', err);
      tbody.innerHTML = `<tr><td colspan="6" style="padding: 2rem; text-align: center; color: red;">Gagal memuat data donasi. Silakan muat ulang halaman.</td></tr>`;
    }
  }

  // 2. Render Tabel, Total, & Paginasi
  function renderTabel(dataArray, page = 1) {
    if (dataArray.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="6" style="padding: 3rem 1rem; text-align: center; color: var(--muted);">
            Tidak ada riwayat donasi untuk kategori ini.
          </td>
        </tr>`;
      paginationContainer.innerHTML = '';
      return;
    }

    // --- Logika Paginasi ---
    const totalPages = Math.ceil(dataArray.length / itemsPerPage);
    const startIndex = (page - 1) * itemsPerPage;
    const endIndex = startIndex + itemsPerPage;
    
    // Potong array data hanya untuk halaman ini
    const dataHalamanIni = dataArray.slice(startIndex, endIndex);

    let html = '';
    let totalNominalSeluruhnya = 0; 
    let nomorUrut = startIndex + 1; // Agar nomor berlanjut di halaman berikutnya

    // Hitung TOTAL KESELURUHAN (dari dataArray yang sedang difilter, bukan cuma data per halaman)
    dataArray.forEach(data => {
      totalNominalSeluruhnya += (parseInt(data.jumlah) || 0);
    });

    // Render baris untuk halaman ini saja
    dataHalamanIni.forEach((data) => {
      const nominal = parseInt(data.jumlah) || 0;
      const bgRow = nomorUrut % 2 === 0 ? 'var(--light)' : 'var(--white)';
      const jumlahFormatted = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(nominal);
      
      const kategoriDonasi = data.kategori || 'Lainnya';
      let warnaBg = '#e3f2e8'; 
      let warnaTeks = '#145c38';
      
      if(kategoriDonasi === 'Zakat') { warnaBg = '#EBF8FF'; warnaTeks = '#2B6CB0'; } 
      else if(kategoriDonasi === 'Infaq') { warnaBg = '#FEEBC8'; warnaTeks = '#C05621'; } 
      else if(kategoriDonasi === 'Wakaf') { warnaBg = '#FEFCBF'; warnaTeks = '#975A16'; } 
      else if(kategoriDonasi === 'Shodaqoh') { warnaBg = '#F3E8FF'; warnaTeks = '#6B21A8'; } 

      html += `
        <tr style="border-bottom: 1px solid var(--border); background-color: ${bgRow}; transition: background 0.3s;">
          <td style="padding: 0.85rem 1.5rem; text-align: center; color: var(--muted);">${nomorUrut++}</td>
          <td style="padding: 0.85rem 1.5rem; font-weight: 600; color: var(--secondary);">${data.nama}</td>
          <td style="padding: 0.85rem 1.5rem; color: var(--muted);">${data.kota || data.alamat || '-'}</td>
          <td style="padding: 0.85rem 1.5rem; color: var(--muted);">${data.tanggal}</td>
          <td style="padding: 0.85rem 1.5rem; text-align: center;">
            <span style="background: ${warnaBg}; color: ${warnaTeks}; padding: 0.25rem 0.85rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; display: inline-block;">
              ${kategoriDonasi}
            </span>
          </td>
          <td style="padding: 0.85rem 1.5rem; text-align: right; font-weight: 700; color: var(--primary-dark);">${jumlahFormatted}</td>
        </tr>`;
    });

    const totalFormatted = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(totalNominalSeluruhnya);

    // Tambahkan Baris TOTAL di bawah (Selalu menampilkan total dari semua halaman kategori tersebut)
    html += `
      <tr style="background-color: var(--light); border-top: 2px solid var(--border); border-bottom: 2px solid transparent;">
        <td colspan="5" style="padding: 1.25rem 1.5rem; text-align: right; font-weight: 800; color: var(--secondary); font-size: var(--fs-base);">TOTAL SELURUHNYA :</td>
        <td style="padding: 1.25rem 1.5rem; text-align: right; font-weight: 800; color: var(--primary-dark); font-size: var(--fs-base);">${totalFormatted}</td>
      </tr>
    `;

    tbody.innerHTML = html;

    // --- Render Tombol Navigasi Halaman ---
    renderPagination(totalPages, page);
  }

  // Fungsi untuk membuat deretan tombol halaman [1] [2] [3]
  function renderPagination(totalPages, activePage) {
    if (totalPages <= 1) {
      paginationContainer.innerHTML = '';
      return;
    }

    let pageHtml = '';
    for (let i = 1; i <= totalPages; i++) {
      const activeClass = i === activePage ? 'active' : '';
      pageHtml += `<button class="page-btn ${activeClass}" data-page="${i}">${i}</button>`;
    }
    
    paginationContainer.innerHTML = pageHtml;

    // Tambahkan event click pada setiap tombol halaman
    const pageButtons = document.querySelectorAll('.page-btn');
    pageButtons.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const pageTarget = parseInt(e.target.getAttribute('data-page'));
        currentPage = pageTarget;
        renderTabel(currentFilterData, currentPage); // Render ulang tabel untuk halaman baru
      });
    });
  }

  // 3. Logika Filter Tombol Kategori
  filterButtons.forEach(button => {
    button.addEventListener('click', () => {
      filterButtons.forEach(btn => btn.classList.remove('is-active'));
      button.classList.add('is-active');
      
      const filterValue = button.getAttribute('data-filter');
      currentPage = 1; // Reset ke halaman 1 setiap kali filter berubah
      
      if (filterValue === 'Semua') {
        currentFilterData = [...dataDonasiMaster];
      } else {
        currentFilterData = dataDonasiMaster.filter(item => item.kategori === filterValue);
      }
      
      renderTabel(currentFilterData, currentPage); 
    });
  });

  loadDonasi();
</script>

</body>
