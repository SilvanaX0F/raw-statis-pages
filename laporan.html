<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Donasi | Yayasan Padang Wulan Cipicung</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  
  <!-- ================= HEADER / NAVBAR ================= -->
  <header>
    <a class="skip-link" href="#main">Langsung ke konten utama</a>
    <nav class="navbar" aria-label="Navigasi utama">
      <div class="navbar__inner">
        <a href="index.html" class="navbar__brand" aria-label="Yayasan Padang Wulan Cipicung — Beranda">
          <!-- Menggunakan logo footer (putih) karena background navbar sekarang gelap -->
          <img src="images/logo-footer.png" alt="Logo Yayasan Padang Wulan Cipicung" width="190" height="40">
        </a>
        <div class="navbar__menu" id="navbar-menu" data-nav-menu>
          <ul class="navbar__links">
            <li><a href="index.html">Beranda</a></li>
            <li><a href="tentang.html">Tentang Kami</a></li>
            <li><a href="program.html">Program</a></li>
            <li><a href="berita.html">Berita</a></li>
            <li><a href="galeri.html">Galeri</a></li>
            <li><a href="laporan.html" class="is-active" aria-current="page">Laporan</a></li>
            <li><a href="publikasi.html">Legalitas</a></li>
            <li><a href="kontak.html">Kontak</a></li>
          </ul>
          <div class="navbar__cta">
            <a href="donasi.html" class="btn btn-primary">Donasi</a>
          </div>
        </div>
        
        <!-- Tombol Hamburger Mobile -->
        <button type="button" class="navbar__toggle" data-nav-toggle aria-expanded="false" aria-controls="navbar-menu" aria-label="Buka menu navigasi">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>

  <main id="main">

    <!-- ================= LAPORAN DONASI ================= -->
    <section class="section" id="laporan-donasi">
      <div class="container">
        <div class="flex-between mb-lg" style="align-items: flex-end; flex-wrap: wrap; gap: 1rem;">
          <div class="section-heading" style="margin-bottom: 0;">
            <span class="section-heading__eyebrow">Transparansi Keuangan</span>
            <h2>Laporan Donasi Masuk</h2>
          </div>
        </div>

        <!-- Tombol Filter Kategori -->
        <div class="gallery-filter" id="filter-donasi">
          <button type="button" class="is-active" data-filter="Semua">Semua Donasi</button>
          <button type="button" data-filter="Zakat">Zakat</button>
          <button type="button" data-filter="Infaq">Infaq</button>
          <button type="button" data-filter="Shodaqoh">Shodaqoh</button>
          <button type="button" data-filter="Wakaf">Wakaf</button>
        </div>

        <!-- Tabel Donasi -->
        <div class="card" style="overflow-x: auto; padding: 0; border-radius: var(--radius-md); box-shadow: var(--shadow-sm);">
          <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: var(--fs-sm);">
            <thead>
              <tr style="background-color: var(--dark); color: var(--white);">
                <th class="donasi-th" style="text-align: center; width: 60px;">No</th>
                <th class="donasi-th">Nama Donatur</th>
                <th class="donasi-th">Alamat</th>
                <th class="donasi-th">Tanggal</th>
                <th class="donasi-th" style="text-align: center;">Kategori</th>
                <th class="donasi-th" style="text-align: right;">Jumlah (Rp)</th>
              </tr>
            </thead>
            <tbody id="tabel-donasi-body">
              <tr>
                <td colspan="6" style="padding: 3rem; text-align: center; color: var(--muted);">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 24px; height: 24px; margin-bottom: 0.5rem; animation: spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg><br>
                  Memuat data donasi dari sistem...
                </td>
              </tr>
            </tbody>
          </table>
          
          <!-- Container untuk Paginasi (Navigasi Halaman) -->
          <div id="pagination-container" style="padding: 1rem; display: flex; justify-content: center; gap: 0.5rem; border-top: 1px solid var(--border); background: var(--white);">
            <!-- Tombol angka halaman otomatis via JS -->
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- ================= STYLING TAMBAHAN & RESPONSIVE ================= -->
  <style>
    @keyframes spin { 100% { transform: rotate(360deg); } }
    
    /* STYLING JARAK TABEL - DESKTOP */
    .donasi-th { padding: 1rem 1.5rem; }
    .donasi-td { padding: 0.85rem 1.5rem; }
    .donasi-td-total { padding: 1.25rem 1.5rem; }
    .kategori-badge { padding: 0.25rem 0.85rem; font-size: 0.75rem; }

    /* STYLING JARAK TABEL - MOBILE (Menghemat ruang) */
    @media (max-width: 768px) {
      .donasi-th {
        padding: 0.6rem 0.5rem; 
        font-size: var(--fs-xs); 
        white-space: nowrap; 
      }
      .donasi-td {
        padding: 0.5rem 0.5rem; 
        font-size: var(--fs-xs);
      }
      .donasi-td-total {
        padding: 0.8rem 0.5rem;
        font-size: var(--fs-sm) !important;
      }
      .kategori-badge {
        padding: 0.2rem 0.5rem;
        font-size: 0.65rem;
      }
    }

    /* Styling Tombol Paginasi */
    .page-btn {
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--border);
      background: var(--white);
      color: var(--secondary);
      border-radius: 4px;
      cursor: pointer;
      font-size: var(--fs-sm);
      font-weight: 600;
      transition: all 0.2s ease;
    }
    
    .page-btn:hover {
      background: var(--light);
      border-color: var(--secondary);
    }
    
    .page-btn.active {
      background: var(--primary);
      color: var(--white);
      border-color: var(--primary);
    }
  </style>

  <!-- ================= SCRIPT LOGIKA DONASI (Firebase) ================= -->
  <script type="module">
    import { db, collection, getDocs, query, orderBy } from './js/firebase-config.js';

    const tbody = document.getElementById('tabel-donasi-body');
    const paginationContainer = document.getElementById('pagination-container');
    const filterButtons = document.querySelectorAll('#filter-donasi button');
    
    let dataDonasiMaster = [];
    let currentFilterData = [];
    
    // Konfigurasi Paginasi
    let currentPage = 1;
    const itemsPerPage = 10; 

    // 1. Memuat Data dari Firebase
    async function loadDonasi() {
      try {
        const q = query(collection(db, 'donations'));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" style="padding: 3rem 1rem; text-align: center; color: var(--muted);">
                <strong>Belum Ada Data Donasi</strong>
                <p style="font-size: var(--fs-xs); margin-top: 0.25rem;">Saat ini belum ada riwayat donasi masuk yang ditampilkan.</p>
              </td>
            </tr>`;
          paginationContainer.innerHTML = '';
          return;
        }

        dataDonasiMaster = [];
        querySnapshot.forEach((doc) => {
          dataDonasiMaster.push(doc.data());
        });

        // Mengurutkan dari tanggal terbaru
        dataDonasiMaster.sort((a, b) => {
          const dateA = new Date(a.tanggal);
          const dateB = new Date(b.tanggal);
          return dateB - dateA;
        });

        currentFilterData = [...dataDonasiMaster];
        renderTabel(currentFilterData, currentPage);

      } catch (err) {
        console.error('Error fetching data:', err);
        tbody.innerHTML = `<tr><td colspan="6" style="padding: 2rem; text-align: center; color: red;">Gagal memuat data donasi. Silakan muat ulang halaman.</td></tr>`;
      }
    }

    // 2. Render Tabel, Baris Total, dan Paginasi
    function renderTabel(dataArray, page = 1) {
      if (dataArray.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" style="padding: 3rem 1rem; text-align: center; color: var(--muted);">
              Tidak ada riwayat donasi untuk kategori ini.
            </td>
          </tr>`;
        paginationContainer.innerHTML = '';
        return;
      }

      const totalPages = Math.ceil(dataArray.length / itemsPerPage);
      const startIndex = (page - 1) * itemsPerPage;
      const endIndex = startIndex + itemsPerPage;
      
      const dataHalamanIni = dataArray.slice(startIndex, endIndex);

      let html = '';
      let totalNominalSeluruhnya = 0; 
      let nomorUrut = startIndex + 1; 

      // Hitung total dari keseluruhan data terfilter (bukan cuma yg tampil di halaman ini)
      dataArray.forEach(data => {
        totalNominalSeluruhnya += (parseInt(data.jumlah) || 0);
      });

      // Cetak baris per baris donatur
      dataHalamanIni.forEach((data) => {
        const nominal = parseInt(data.jumlah) || 0;
        const bgRow = nomorUrut % 2 === 0 ? 'var(--light)' : 'var(--white)';
        const jumlahFormatted = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(nominal);
        
        const kategoriDonasi = data.kategori || 'Lainnya';
        let warnaBg = '#e3f2e8'; 
        let warnaTeks = '#145c38';
        
        if(kategoriDonasi === 'Zakat') { warnaBg = '#EBF8FF'; warnaTeks = '#2B6CB0'; } 
        else if(kategoriDonasi === 'Infaq') { warnaBg = '#FEEBC8'; warnaTeks = '#C05621'; } 
        else if(kategoriDonasi === 'Wakaf') { warnaBg = '#FEFCBF'; warnaTeks = '#975A16'; } 
        else if(kategoriDonasi === 'Shodaqoh') { warnaBg = '#F3E8FF'; warnaTeks = '#6B21A8'; } 

        html += `
          <tr style="border-bottom: 1px solid var(--border); background-color: ${bgRow}; transition: background 0.3s;">
            <td class="donasi-td" style="text-align: center; color: var(--muted);">${nomorUrut++}</td>
            <td class="donasi-td" style="font-weight: 600; color: var(--secondary);">${data.nama}</td>
            <td class="donasi-td" style="color: var(--muted);">${data.kota || data.alamat || '-'}</td>
            <td class="donasi-td" style="color: var(--muted);">${data.tanggal}</td>
            <td class="donasi-td" style="text-align: center;">
              <span class="kategori-badge" style="background: ${warnaBg}; color: ${warnaTeks}; border-radius: 20px; font-weight: 700; display: inline-block;">
                ${kategoriDonasi}
              </span>
            </td>
            <td class="donasi-td" style="text-align: right; font-weight: 700; color: var(--primary-dark);">${jumlahFormatted}</td>
          </tr>`;
      });

      const totalFormatted = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(totalNominalSeluruhnya);

      // Cetak baris Total di ujung bawah
      html += `
        <tr style="background-color: var(--light); border-top: 2px solid var(--border); border-bottom: 2px solid transparent;">
          <td colspan="5" class="donasi-td-total" style="text-align: right; font-weight: 800; color: var(--secondary); font-size: var(--fs-base);">TOTAL SELURUHNYA :</td>
          <td class="donasi-td-total" style="text-align: right; font-weight: 800; color: var(--primary-dark); font-size: var(--fs-base);">${totalFormatted}</td>
        </tr>
      `;

      tbody.innerHTML = html;
      renderPagination(totalPages, page);
    }

    // 3. Logika Menampilkan Tombol Paginasi
    function renderPagination(totalPages, activePage) {
      if (totalPages <= 1) {
        paginationContainer.innerHTML = '';
        return;
      }

      let pageHtml = '';
      for (let i = 1; i <= totalPages; i++) {
        const activeClass = i === activePage ? 'active' : '';
        pageHtml += `<button class="page-btn ${activeClass}" data-page="${i}">${i}</button>`;
      }
      
      paginationContainer.innerHTML = pageHtml;

      const pageButtons = document.querySelectorAll('.page-btn');
      pageButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          const pageTarget = parseInt(e.target.getAttribute('data-page'));
          currentPage = pageTarget;
          renderTabel(currentFilterData, currentPage); 
        });
      });
    }

    // 4. Logika Filter Kategori
    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        filterButtons.forEach(btn => btn.classList.remove('is-active'));
        button.classList.add('is-active');
        
        const filterValue = button.getAttribute('data-filter');
        currentPage = 1; // Reset halaman ke-1 saat filter berubah
        
        if (filterValue === 'Semua') {
          currentFilterData = [...dataDonasiMaster];
        } else {
          currentFilterData = dataDonasiMaster.filter(item => item.kategori === filterValue);
        }
        
        renderTabel(currentFilterData, currentPage); 
      });
    });

    loadDonasi();
  </script>

  <!-- ================= SCRIPT HAMBURGER MENU (MOBILE) ================= -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const navToggle = document.querySelector('[data-nav-toggle]');
      const navMenu = document.querySelector('[data-nav-menu]');

      if (navToggle && navMenu) {
        navToggle.addEventListener('click', function() {
          const isExpanded = navToggle.getAttribute('aria-expanded') === 'true';
          navToggle.setAttribute('aria-expanded', !isExpanded);
          navMenu.classList.toggle('is-open');
        });
      }
    });
  </script>

</body>
</html>
