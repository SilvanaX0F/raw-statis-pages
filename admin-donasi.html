<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Kelola Donasi | YBU Padang Wulan</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Styling khusus tombol aksi admin */
    .btn-aksi {
      padding: 0.35rem 0.65rem;
      font-size: 0.75rem;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      transition: opacity 0.2s;
    }
    .btn-aksi:hover { opacity: 0.8; }
    .btn-edit { background: #38BDF8; color: white; margin-right: 0.25rem; }
    .btn-hapus { background: #EF4444; color: white; }
    
    /* Layout admin agar rapi */
    .admin-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      align-items: start;
    }

    .admin-form-container {
      padding: var(--space-lg);
    }

    /* Memisahkan fungsi sticky khusus desktop agar tidak bertumpuk di mobile */
    @media (min-width: 992px) {
      .admin-layout { grid-template-columns: 350px 1fr; }
      .admin-form-container {
        position: sticky; 
        top: 2rem;
      }
    }
  </style>
</head>
<body style="background-color: var(--light);">

  <section class="section">
    <div class="container admin-layout">
      
      <!-- ================= BAGIAN FORM INPUT / EDIT ================= -->
      <div class="card admin-form-container">
        <h2 id="form-title" style="margin-bottom: 1rem; font-size: 1.5rem;">Input Donasi Baru</h2>
        
        <form id="form-donasi">
          <input type="hidden" id="edit-id" value="">

          <div class="form-field">
            <label for="nama">Nama Donatur</label>
            <input type="text" id="nama" placeholder="Nama Donatur" required>
          </div>
          
          <div class="form-field">
            <label for="kota">Kota / Alamat (Opsional)</label>
            <input type="text" id="kota" placeholder="Contoh: Cipicung">
          </div>

          <div class="form-field">
            <label for="tanggal">Tanggal Donasi</label>
            <input type="date" id="tanggal" required>
          </div>

          <div class="form-field">
            <label for="jumlah">Jumlah Donasi (Rp)</label>
            <input type="number" id="jumlah" placeholder="Contoh: 50000" required>
          </div>

          <div class="form-field">
            <label for="kategori">Kategori</label>
            <select id="kategori" required style="width: 100%; padding: 0.8rem 1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--white); color: var(--text);">
              <option value="" disabled selected>Pilih Kategori</option>
              <option value="Zakat">Zakat</option>
              <option value="Infaq">Infaq</option>
              <option value="Shodaqoh">Shodaqoh</option>
              <option value="Wakaf">Wakaf</option>
              <option value="Lainnya">Lainnya</option>
            </select>
          </div>

          <button type="submit" id="btn-simpan" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
            Simpan Data Baru
          </button>
          
          <button type="button" id="btn-batal" class="btn btn-secondary" style="width: 100%; margin-top: 0.5rem; display: none;">
            Batal Edit
          </button>
        </form>

        <p id="pesan-status" style="margin-top: 1rem; text-align: center; font-size: var(--fs-sm); font-weight: 600;"></p>
      </div>

      <!-- ================= BAGIAN TABEL DATA ================= -->
      <div class="card" style="overflow-x: auto; padding: 0;">
        
        <!-- Header Tabel & Form Pencarian -->
        <div style="padding: 1.5rem; border-bottom: 1px solid var(--border); background: var(--white); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
          <div>
            <h3 style="margin: 0;">Kelola Data Terkini</h3>
            <p style="font-size: var(--fs-sm); color: var(--muted); margin-top: 0.25rem;">Menampilkan 10 data terakhir. Klik edit untuk merubah.</p>
          </div>
          <div style="flex-grow: 1; max-width: 300px;">
            <input type="text" id="input-cari" placeholder="Cari nama atau alamat..." style="width: 100%; padding: 0.6rem 1rem; border: 1px solid var(--border); border-radius: 4px; font-size: var(--fs-sm);">
          </div>
        </div>
        
        <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: var(--fs-sm);">
          <thead>
            <tr style="background-color: var(--dark); color: var(--white);">
              <th style="padding: 1rem; text-align: center;">No</th>
              <th style="padding: 1rem;">Nama & Tanggal</th>
              <th style="padding: 1rem;">Kategori</th>
              <th style="padding: 1rem; text-align: right;">Jumlah (Rp)</th>
              <th style="padding: 1rem; text-align: center;">Aksi</th>
            </tr>
          </thead>
          <tbody id="tabel-admin-body">
            <tr><td colspan="5" style="padding: 2rem; text-align: center;">Memuat data...</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </section>

  <!-- ================= SCRIPT FIREBASE & LOGIKA ADMIN ================= -->
  <script type="module">
    import { db, collection, addDoc, getDocs, query, serverTimestamp, doc, updateDoc, deleteDoc } from './js/firebase-config.js';

    const form = document.getElementById('form-donasi');
    const tbody = document.getElementById('tabel-admin-body');
    const pesanStatus = document.getElementById('pesan-status');
    const btnSimpan = document.getElementById('btn-simpan');
    const btnBatal = document.getElementById('btn-batal');
    const formTitle = document.getElementById('form-title');
    const inputCari = document.getElementById('input-cari');
    
    // Array master untuk menampung seluruh data agar bisa dicari
    let dataDonasiMaster = []; 

    // ================= FUNGSI 1: MEMUAT DATA DARI FIREBASE =================
    async function loadDataAdmin() {
      try {
        const q = query(collection(db, 'donations'));
        const querySnapshot = await getDocs(q);

        if (querySnapshot.empty) {
          tbody.innerHTML = `<tr><td colspan="5" style="padding: 2rem; text-align: center; color: var(--muted);">Belum ada data donasi.</td></tr>`;
          return;
        }

        dataDonasiMaster = []; // Kosongkan master data

        querySnapshot.forEach((documentSnap) => {
          const data = documentSnap.data();
          data.id = documentSnap.id; // Sisipkan ID firebase ke dalam objek
          dataDonasiMaster.push(data);
        });

        // Urutkan data berdasarkan tanggal terbaru
        dataDonasiMaster.sort((a, b) => {
          return new Date(b.tanggal) - new Date(a.tanggal);
        });

        // Render hanya 10 data pertama saat awal dimuat
        renderTabelAdmin(dataDonasiMaster.slice(0, 10));

      } catch (err) {
        console.error('Error fetching admin data:', err);
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: red;">Gagal memuat data.</td></tr>`;
      }
    }

    // ================= FUNGSI 2: RENDER TABEL (MENCETAK HTML) =================
    function renderTabelAdmin(dataArray) {
      if (dataArray.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="padding: 2rem; text-align: center; color: var(--muted);">Data tidak ditemukan.</td></tr>`;
        return;
      }

      let html = '';
      let no = 1;

      dataArray.forEach((data) => {
        const bgRow = no % 2 === 0 ? 'var(--light)' : 'var(--white)';
        const jumlahFormatted = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(data.jumlah);
        const kategoriDonasi = data.kategori || 'Lainnya';

        html += `
          <tr style="border-bottom: 1px solid var(--border); background-color: ${bgRow};">
            <td style="padding: 0.85rem 1rem; text-align: center; color: var(--muted);">${no++}</td>
            <td style="padding: 0.85rem 1rem;">
              <strong style="color: var(--secondary);">${data.nama}</strong><br>
              <span style="font-size: 0.75rem; color: var(--muted);">${data.tanggal} | ${data.kota || '-'}</span>
            </td>
            <td style="padding: 0.85rem 1rem; font-weight: 600;">${kategoriDonasi}</td>
            <td style="padding: 0.85rem 1rem; text-align: right; font-weight: 700; color: var(--primary-dark);">${jumlahFormatted}</td>
            <td style="padding: 0.85rem 1rem; text-align: center; white-space: nowrap;">
              <button type="button" class="btn-aksi btn-edit" data-id="${data.id}">Edit</button>
              <button type="button" class="btn-aksi btn-hapus" data-id="${data.id}">Hapus</button>
            </td>
          </tr>`;
      });

      tbody.innerHTML = html;
    }

    // ================= FUNGSI 3: LOGIKA PENCARIAN (SEARCH) =================
    inputCari.addEventListener('input', (e) => {
      const kataKunci = e.target.value.toLowerCase();
      
      if (kataKunci === '') {
        // Jika kotak pencarian kosong, kembalikan tampilan 10 data terakhir
        renderTabelAdmin(dataDonasiMaster.slice(0, 10));
      } else {
        // Filter mencari kecocokan pada nama atau kota/alamat
        const dataHasilPencarian = dataDonasiMaster.filter(item => {
          const namaCocok = item.nama.toLowerCase().includes(kataKunci);
          const kotaCocok = item.kota && item.kota.toLowerCase().includes(kataKunci);
          return namaCocok || kotaCocok;
        });
        
        // Tampilkan seluruh data yang cocok (tidak dibatasi 10)
        renderTabelAdmin(dataHasilPencarian);
      }
    });

    // ================= FUNGSI 4: TAMBAH ATAU UPDATE DATA =================
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSimpan.disabled = true;
      btnSimpan.textContent = 'Menyimpan...';

      const editId = document.getElementById('edit-id').value;
      const nama = document.getElementById('nama').value;
      const kota = document.getElementById('kota').value || '-';
      const tanggal = document.getElementById('tanggal').value;
      const jumlah = parseInt(document.getElementById('jumlah').value);
      const kategori = document.getElementById('kategori').value;

      try {
        if (editId === "") {
          // MODE TAMBAH
          await addDoc(collection(db, 'donations'), {
            nama: nama, kota: kota, tanggal: tanggal, jumlah: jumlah, kategori: kategori, createdAt: serverTimestamp()
          });
          pesanStatus.style.color = 'green';
          pesanStatus.textContent = '✅ Data baru berhasil ditambahkan!';
        } else {
          // MODE UPDATE
          const docRef = doc(db, 'donations', editId);
          await updateDoc(docRef, {
            nama: nama, kota: kota, tanggal: tanggal, jumlah: jumlah, kategori: kategori
          });
          pesanStatus.style.color = 'green';
          pesanStatus.textContent = '✅ Data berhasil diperbarui!';
          resetForm();
        }

        form.reset();
        inputCari.value = ''; // Kosongkan pencarian saat ada data baru
        loadDataAdmin(); // Muat ulang tabel
        setTimeout(() => { pesanStatus.textContent = ''; }, 3000);

      } catch (error) {
        console.error('Gagal menyimpan:', error);
        pesanStatus.style.color = 'red';
        pesanStatus.textContent = '❌ Gagal menyimpan: ' + error.message;
      } finally {
        btnSimpan.disabled = false;
        btnSimpan.textContent = document.getElementById('edit-id').value === "" ? 'Simpan Data Baru' : 'Update Data';
      }
    });

    // ================= FUNGSI 5: INTERAKSI TOMBOL EDIT & HAPUS =================
    tbody.addEventListener('click', async (e) => {
      // Tombol EDIT
      if (e.target.closest('.btn-edit')) {
        const id = e.target.closest('.btn-edit').getAttribute('data-id');
        const data = dataDonasiMaster.find(item => item.id === id); // Cari data dari array master
        
        document.getElementById('edit-id').value = data.id;
        document.getElementById('nama').value = data.nama;
        document.getElementById('kota').value = data.kota === '-' ? '' : data.kota;
        document.getElementById('tanggal').value = data.tanggal;
        document.getElementById('jumlah').value = data.jumlah;
        document.getElementById('kategori').value = data.kategori || '';

        formTitle.textContent = "Edit Data Donasi";
        formTitle.style.color = "#38BDF8";
        btnSimpan.textContent = "Update Data";
        btnBatal.style.display = "block";
        pesanStatus.textContent = '';
        
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      // Tombol HAPUS
      if (e.target.closest('.btn-hapus')) {
        const id = e.target.closest('.btn-hapus').getAttribute('data-id');
        const konfirmasi = confirm('Apakah Anda yakin ingin menghapus data donasi ini secara permanen?');
        
        if (konfirmasi) {
          try {
            await deleteDoc(doc(db, 'donations', id));
            pesanStatus.style.color = 'green';
            pesanStatus.textContent = '✅ Data berhasil dihapus!';
            inputCari.value = '';
            loadDataAdmin(); 
            setTimeout(() => { pesanStatus.textContent = ''; }, 3000);
          } catch (error) {
            console.error('Gagal menghapus:', error);
            alert('Gagal menghapus data!');
          }
        }
      }
    });

    // ================= FUNGSI 6: BATAL EDIT =================
    btnBatal.addEventListener('click', resetForm);

    function resetForm() {
      form.reset();
      document.getElementById('edit-id').value = "";
      formTitle.textContent = "Input Donasi Baru";
      formTitle.style.color = "inherit";
      btnSimpan.textContent = "Simpan Data Baru";
      btnBatal.style.display = "none";
      pesanStatus.textContent = '';
    }

    // Inisialisasi saat pertama kali load
    loadDataAdmin();
  </script>
</body>
</html>
