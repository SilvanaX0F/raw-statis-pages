<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin | Yayasan Padang Wulan</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background-color: var(--light);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-card {
      background: var(--white);
      padding: 2.5rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-md);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .login-card img {
      margin-bottom: 1.5rem;
    }
    .form-field {
      text-align: left;
      margin-bottom: 1rem;
    }
    .pesan-error {
      color: #EF4444;
      font-size: var(--fs-sm);
      margin-top: 1rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Ganti src dengan logo berwarna Anda jika perlu -->
    <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 1.5rem;">
      <img src="images/log.png" alt="Logo Yayasan" width="180" style="display: block; margin: 0 auto; max-width: 100%; height: auto;">
    </div>
    <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem;">Masuk ke Dashboard</h2>
    <p style="color: var(--muted); font-size: var(--fs-sm); margin-bottom: 2rem;">Silakan masukkan kredensial pengurus Anda.</p>

    <form id="login-form">
      <div class="form-field">
        <label for="email">Email / Username Pengurus</label>
        <input type="text" id="email" placeholder="admin@ybu-padangwulan.or.id atau master@admin1" required autocomplete="username">
      </div>
      
      <div class="form-field">
        <label for="password">Kata Sandi (Password)</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" id="btn-login" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
        Masuk Sekarang
      </button>
    </form>

    <p id="pesan-error" class="pesan-error">Email atau Password salah!</p>
    
    <div style="margin-top: 2rem;">
      <a href="index.html" style="font-size: var(--fs-sm); color: var(--secondary); text-decoration: underline;">&larr; Kembali ke Beranda Utama</a>
    </div>
  </div>

  <!-- SCRIPT PROSES LOGIN -->
  <script type="module">
    import { auth } from './js/firebase-config.js';
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const form = document.getElementById('login-form');
    const btnLogin = document.getElementById('btn-login');
    const pesanError = document.getElementById('pesan-error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnLogin.disabled = true;
      btnLogin.textContent = 'Memeriksa kredensial...';
      pesanError.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // 1. Kredensial Khusus Master Admin
      if (email.toLowerCase() === 'master@admin1') {
        const masterPassSaved = localStorage.getItem('ybu_master_pass') || '774433';
        if (password === masterPassSaved) {
          const session = {
            email: 'master@admin1',
            role: 'master',
            displayName: 'Master Administrator',
            loggedInAt: new Date().toISOString()
          };
          localStorage.setItem('ybu_auth_session', JSON.stringify(session));
          btnLogin.textContent = 'Berhasil! Mengalihkan ke Panel Master...';
          setTimeout(() => {
            window.location.href = 'dashboard/index.html';
          }, 300);
          return;
        } else {
          pesanError.textContent = "Kata sandi Master Admin salah!";
          pesanError.style.display = 'block';
          btnLogin.disabled = false;
          btnLogin.textContent = 'Masuk Sekarang';
          return;
        }
      }

      // 2. Kredensial Khusus Staff Admin (admin@ybu-padangwulan.or.id)
      if (email.toLowerCase() === 'admin@ybu-padangwulan.or.id') {
        try {
          await signInWithEmailAndPassword(auth, email, password);
        } catch (firebaseErr) {
          console.warn("Firebase Auth fallback check:", firebaseErr.message);
          // Cek fallback password admin operasional
          if (password !== 'admin123' && password !== 'admin' && password !== '774433') {
            pesanError.textContent = "Email atau Password staff tidak valid.";
            pesanError.style.display = 'block';
            btnLogin.disabled = false;
            btnLogin.textContent = 'Masuk Sekarang';
            return;
          }
        }
        const session = {
          email: 'admin@ybu-padangwulan.or.id',
          role: 'admin',
          displayName: 'Staff Administrator',
          loggedInAt: new Date().toISOString()
        };
        localStorage.setItem('ybu_auth_session', JSON.stringify(session));
        btnLogin.textContent = 'Berhasil! Mengalihkan...';
        setTimeout(() => {
          window.location.href = 'dashboard/index.html';
        }, 300);
        return;
      }

      // 3. Autentikasi Standar Firebase Auth
      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;
        const isMaster = user.email && (user.email.toLowerCase() === 'master@admin1');
        const session = {
          email: user.email,
          role: isMaster ? 'master' : 'admin',
          displayName: isMaster ? 'Master Administrator' : 'Staff Admin',
          loggedInAt: new Date().toISOString()
        };
        localStorage.setItem('ybu_auth_session', JSON.stringify(session));
        btnLogin.textContent = 'Berhasil! Mengalihkan...';
        setTimeout(() => {
          window.location.href = 'dashboard/index.html';
        }, 300);
      } catch (error) {
        console.error("Gagal login:", error.message);
        pesanError.textContent = "Email atau Password tidak valid.";
        pesanError.style.display = 'block';
        btnLogin.disabled = false;
        btnLogin.textContent = 'Masuk Sekarang';
      }
    });
  </script>

</body>
</html>
