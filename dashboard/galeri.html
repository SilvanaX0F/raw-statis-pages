<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Galeri | Dashboard YBU Padang Wulan</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    /* Styling Khusus Grid Galeri */
    .img-preview {
      max-width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: var(--radius-md);
      margin-top: 0.5rem;
      display: none;
      border: 1px solid var(--border);
    }
    
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1.5rem;
      padding: 1.5rem;
    }
    .gallery-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    .gallery-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }
    .gallery-card__img {
      width: 100%;
      height: 170px;
      object-fit: cover;
      display: block;
    }
    .gallery-card__body {
      padding: 1.15rem;
    }
    
    /* Tombol Aksi Mengambang (Edit/Delete) */
    .gallery-actions {
      position: absolute;
      top: 0.65rem;
      right: 0.65rem;
      display: flex;
      gap: 0.4rem;
      z-index: 10;
    }
    .btn-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      transition: all 0.2s;
    }
    .btn-icon:hover {
      transform: scale(1.1);
      background: #ffffff;
    }
    .btn-icon svg { width: 15px; height: 15px; }
    .btn-icon.edit { color: var(--accent-blue); }
    .btn-icon.edit:hover { background: var(--accent-blue); color: #ffffff; }
    .btn-icon.delete { color: var(--accent-red); }
    .btn-icon.delete:hover { background: var(--accent-red); color: #ffffff; }
    
    .gallery-card__meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
      font-size: 0.75rem;
    }

    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 1rem;
        padding: 1rem;
      }
      .gallery-card__img { height: 130px; }
    }
  </style>
</head>
<body>

  <!-- HEADER KHUSUS MOBILE -->
  <div class="mobile-header">
    <a href="../index.html" style="display: flex; align-items: center;">
      <img src="../images/log.png" alt="Logo" style="height: 30px;">
    </a>
    <button class="hamburger-btn" id="btn-toggle-menu" aria-label="Buka Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
  </div>

  <!-- OVERLAY GELAP -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="dashboard-layout">
    
    <!-- SIDEBAR NAVIGASI -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <a href="../index.html" style="display: block;">
          <img src="../images/logo-footer-preview.png" alt="Yayasan Padang Wulan">
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Ringkasan Utama</a>
        <a href="donasi.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>Kelola Penerimaan</a>
        <a href="pengeluaran.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Kelola Pengeluaran</a>
        <a href="berita.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>Kelola Berita</a>
        <a href="galeri.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Kelola Galeri</a>
      </nav>
      <div class="sidebar-footer">
        <button type="button" class="btn-logout" onclick="window.prosesLogout()">Logout Akun</button>
        <div class="sidebar-footer-author">By : Cip</div>
      </div>
    </aside>

    <!-- KONTEN UTAMA -->
    <main class="main-content">
      <div class="top-header">
        <h1>Manajemen Galeri Foto</h1>
        <p>Unggah dan kelola dokumentasi foto kegiatan yayasan.</p>
      </div>

      <div class="admin-layout">
        
        <!-- FORM INPUT GALERI -->
        <div class="card admin-form-container">
          <h2 id="form-title" style="margin-bottom: 1.25rem; font-size: 1.2rem; font-weight: 700; color: var(--text-dark); letter-spacing: -0.015em;">Tambah Foto Baru</h2>
          
          <form id="form-galeri">
            <input type="hidden" id="edit-id" value="">
            <input type="hidden" id="old-image-url" value="">
            <input type="hidden" id="old-date" value="">

            <div class="form-field">
              <label for="judul">Judul / Keterangan Foto</label>
              <textarea id="judul" placeholder="Tuliskan keterangan kegiatan..." required style="min-height: 80px; resize: vertical;"></textarea>
            </div>

            <div class="form-field">
              <label for="kategori">Kategori Album</label>
              <select id="kategori" required>
                <option value="Sosial">Sosial</option>
                <option value="Kemanusiaan">Kemanusiaan</option>
                <option value="Lainnya">Lainnya</option>
              </select>
            </div>

            <div class="form-field">
              <label for="gambar">File Foto (Max 2 MB)</label>
              <input type="file" id="gambar" accept="image/*" style="padding: 0.6rem; border: 1px dashed #cbd5e1; background: var(--bg-canvas);">
              <img id="img-preview" class="img-preview" src="" alt="Preview">
            </div>

            <button type="submit" id="btn-simpan" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 0.5rem; background: var(--accent-amber); box-shadow: 0 2px 6px rgba(217, 119, 6, 0.25);">
              Unggah Foto
            </button>
            <button type="button" id="btn-batal" class="btn btn-secondary" style="width: 100%; margin-top: 0.5rem; display: none; padding: 0.85rem;">
              Batal Edit
            </button>
          </form>
          <p id="pesan-status" style="margin-top: 1rem; text-align: center; font-size: 0.875rem; font-weight: 600;"></p>
        </div>

        <!-- GRID DATA GALERI -->
        <div class="card">
          <div style="padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; background: var(--bg-subtle);">
            <div>
              <h3 style="margin: 0; font-size: 1.05rem; font-weight: 700; color: var(--text-dark); letter-spacing: -0.01em;">Daftar Foto Galeri</h3>
            </div>
            
            <div style="flex-grow: 1; max-width: 250px; width: 100%;">
              <select id="filter-kategori" style="width: 100%; padding: 0.6rem 0.95rem; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.875rem; font-weight: 600; color: var(--text-dark); background: #ffffff;">
                <option value="Semua">Semua Kategori</option>
                <option value="Sosial">Sosial</option>
                <option value="Kemanusiaan">Kemanusiaan</option>
                <option value="Lainnya">Lainnya</option>
              </select>
            </div>
          </div>
          
          <div id="galeri-admin-grid" class="gallery-grid">
            <div style="grid-column: 1 / -1; padding: 2rem; text-align: center; color: var(--text-muted);">Memuat data galeri...</div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- LOGIKA MENU MOBILE (HAMBURGER) -->
  <script>
    const btnToggle = document.getElementById('btn-toggle-menu');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    function toggleMenu() {
      sidebar.classList.toggle('active');
      overlay.classList.toggle('active');
    }

    btnToggle.addEventListener('click', toggleMenu);
    overlay.addEventListener('click', toggleMenu);
  </script>

  <script type="module" src="js/auth-guard.js"></script>

  <!-- LOGIKA CRUD & UPLOAD IMGBB GALERI -->
  <script type="module">
    import { db, collection, addDoc, getDocs, query, serverTimestamp, doc, updateDoc, deleteDoc } from '../js/firebase-config.js';
    import { pasangSemuaCustomSelect } from './js/custom-select.js';

    const IMGBB_API_KEY = "0eeb8a2cc63b8f48b7841e72d0a034b3";

    pasangSemuaCustomSelect([
      { selector: '#kategori', title: 'Pilih Kategori Album' },
      { selector: '#filter-kategori', title: 'Filter Kategori Galeri', compact: true },
    ]);

    const form = document.getElementById('form-galeri');
    const gridContainer = document.getElementById('galeri-admin-grid');
    const pesanStatus = document.getElementById('pesan-status');
    const btnSimpan = document.getElementById('btn-simpan');
    const btnBatal = document.getElementById('btn-batal');
    const inputGambar = document.getElementById('gambar');
    const imgPreview = document.getElementById('img-preview');
    const filterKategori = document.getElementById('filter-kategori');
    
    let dataGaleriMaster = []; 

    function getTanggalOtomatis() {
      const namaBulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
      const d = new Date();
      return `${d.getDate()} ${namaBulan[d.getMonth()]} ${d.getFullYear()}`;
    }

    inputGambar.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          imgPreview.src = e.target.result;
          imgPreview.style.display = 'block';
        }
        reader.readAsDataURL(file);
      } else {
        imgPreview.style.display = 'none';
        imgPreview.src = '';
      }
    });

    async function loadDataAdmin() {
      try {
        const q = query(collection(db, 'gallery'));
        const snap = await getDocs(q);

        if (snap.empty) {
          gridContainer.innerHTML = `<div style="grid-column: 1 / -1; padding: 2rem; text-align: center; color: var(--text-muted);">Belum ada foto di galeri.</div>`;
          return;
        }

        dataGaleriMaster = []; 
        snap.forEach(doc => {
          const data = doc.data(); data.id = doc.id; dataGaleriMaster.push(data);
        });

        dataGaleriMaster.sort((a, b) => {
          const timeA = a.createdAt ? a.createdAt.toMillis() : 0;
          const timeB = b.createdAt ? b.createdAt.toMillis() : 0;
          return timeB - timeA;
        });
        
        renderGridAdmin(dataGaleriMaster);

      } catch (err) {
        console.error(err);
        gridContainer.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--accent-red); padding: 2rem;">Gagal memuat data galeri.</div>`;
      }
    }

    function renderGridAdmin(dataArray) {
      if (dataArray.length === 0) {
        gridContainer.innerHTML = `<div style="grid-column: 1 / -1; padding: 2rem; text-align: center; color: var(--text-muted);">Tidak ada foto untuk kategori ini.</div>`;
        return;
      }
      
      let html = '';
      dataArray.forEach((data) => {
        const imgSrc = data.imageUrl || 'https://via.placeholder.com/300x200?text=No+Image';

        html += `
          <div class="gallery-card">
            <div style="position: relative;">
              <img src="${imgSrc}" alt="Foto Galeri" class="gallery-card__img">
              <div class="gallery-actions">
                <button type="button" class="btn-icon edit btn-edit" data-id="${data.id}" title="Edit Keterangan">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                </button>
                <button type="button" class="btn-icon delete btn-hapus" data-id="${data.id}" title="Hapus Foto">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                </button>
              </div>
            </div>
            <div class="gallery-card__body">
              <h4 style="margin: 0; font-size: 0.95rem; font-weight: 700; color: var(--text-dark); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${data.judul}</h4>
              <div class="gallery-card__meta">
                <span style="color: var(--text-muted); font-size: 0.75rem;">📅 ${data.tanggal || '-'}</span>
                <span class="badge-kat">${data.kategori}</span>
              </div>
            </div>
          </div>`;
      });
      gridContainer.innerHTML = html;
    }

    filterKategori.addEventListener('change', (e) => {
      const kategoriDipilih = e.target.value;
      if (kategoriDipilih === 'Semua') {
        renderGridAdmin(dataGaleriMaster);
      } else {
        const hasilFilter = dataGaleriMaster.filter(item => item.kategori === kategoriDipilih);
        renderGridAdmin(hasilFilter);
      }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btnSimpan.disabled = true;
      btnSimpan.textContent = 'Mengunggah Foto...';

      const editId = document.getElementById('edit-id').value;
      const judul = document.getElementById('judul').value;
      const kategori = document.getElementById('kategori').value;
      const fileGambar = inputGambar.files[0];
      
      let finalImageUrl = document.getElementById('old-image-url').value;
      let tanggalSimpan = document.getElementById('old-date').value || getTanggalOtomatis();

      try {
        if (fileGambar) {
          const formData = new FormData();
          formData.append('image', fileGambar);

          const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
            method: 'POST',
            body: formData
          });

          const dataImgBB = await response.json();
          if (dataImgBB.success) {
            finalImageUrl = dataImgBB.data.url;
          } else {
            throw new Error('Gagal mengunggah foto ke ImgBB.');
          }
        } else if (editId === "") {
          throw new Error('Harap pilih file foto terlebih dahulu!');
        }

        const dataPayload = { judul, tanggal: tanggalSimpan, kategori, imageUrl: finalImageUrl };

        if (editId === "") {
          dataPayload.createdAt = serverTimestamp();
          await addDoc(collection(db, 'gallery'), dataPayload);
          pesanStatus.style.color = 'var(--primary)'; pesanStatus.textContent = '✅ Foto berhasil ditambahkan!';
        } else {
          dataPayload.updatedAt = serverTimestamp();
          await updateDoc(doc(db, 'gallery', editId), dataPayload);
          pesanStatus.style.color = 'var(--primary)'; pesanStatus.textContent = '✅ Info foto berhasil diperbarui!';
          resetForm();
        }

        form.reset(); imgPreview.style.display = 'none'; 
        filterKategori.value = 'Semua'; 
        loadDataAdmin();
        setTimeout(() => { pesanStatus.textContent = ''; }, 3000);

      } catch (error) {
        pesanStatus.style.color = 'var(--accent-red)'; pesanStatus.textContent = '❌ Gagal: ' + error.message;
        console.error(error);
      } finally {
        btnSimpan.disabled = false;
        btnSimpan.textContent = document.getElementById('edit-id').value === "" ? 'Unggah Foto' : 'Update Foto';
      }
    });

    gridContainer.addEventListener('click', async (e) => {
      if (e.target.closest('.btn-edit')) {
        const id = e.target.closest('.btn-edit').getAttribute('data-id');
        const data = dataGaleriMaster.find(item => item.id === id);
        
        document.getElementById('edit-id').value = data.id;
        document.getElementById('judul').value = data.judul;
        document.getElementById('kategori').value = data.kategori;
        document.getElementById('old-date').value = data.tanggal;
        document.getElementById('old-image-url').value = data.imageUrl || "";
        
        if(data.imageUrl) {
          imgPreview.src = data.imageUrl;
          imgPreview.style.display = 'block';
        }

        document.getElementById('form-title').textContent = "Edit Keterangan Foto";
        btnSimpan.textContent = "Update Keterangan";
        btnBatal.style.display = "block";
        window.scrollTo({ top: 0, behavior: 'smooth' }); // Scroll otomatis ke atas
      }

      if (e.target.closest('.btn-hapus')) {
        const id = e.target.closest('.btn-hapus').getAttribute('data-id');
        if (confirm('Yakin ingin menghapus foto ini dari galeri?')) {
          try {
            await deleteDoc(doc(db, 'gallery', id));
            loadDataAdmin();
          } catch (error) { alert('Gagal menghapus data!'); }
        }
      }
    });

    btnBatal.addEventListener('click', resetForm);
    
    function resetForm() {
      form.reset(); 
      document.getElementById('edit-id').value = "";
      document.getElementById('old-image-url').value = ""; 
      document.getElementById('old-date').value = ""; 
      imgPreview.style.display = 'none'; 
      imgPreview.src = '';
      document.getElementById('form-title').textContent = "Tambah Foto Baru";
      btnSimpan.textContent = "Unggah Foto"; 
      btnBatal.style.display = "none";
    }

    loadDataAdmin();
  </script>
</body>
</html>
