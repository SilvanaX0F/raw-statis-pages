<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Berita | Dashboard YBU Padang Wulan</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    /* Styling Khusus Gambar Berita */
    .img-preview {
      max-width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: var(--radius-md);
      margin-top: 0.5rem;
      display: none;
      border: 1px solid var(--border);
    }
    .img-thumbnail {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <!-- HEADER KHUSUS MOBILE -->
  <div class="mobile-header">
    <a href="../index.html" style="display: flex; align-items: center;">
      <img src="../images/log.png" alt="Logo" style="height: 30px;">
    </a>
    <button class="hamburger-btn" id="btn-toggle-menu" aria-label="Buka Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
  </div>

  <!-- OVERLAY GELAP -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="dashboard-layout">
    
    <!-- SIDEBAR NAVIGASI -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <a href="../index.html" style="display: block;">
          <img src="../images/logo-footer-preview.png" alt="Yayasan Padang Wulan">
        </a>
      </div>
      <nav class="sidebar-nav">
        <a href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Ringkasan Utama</a>
        <a href="donasi.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>Kelola Penerimaan</a>
        <a href="pengeluaran.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Kelola Pengeluaran</a>
        <a href="berita.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>Kelola Berita</a>
        <a href="galeri.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Kelola Galeri</a>
      </nav>
      <div class="sidebar-footer">
        <button type="button" class="btn-logout" onclick="window.prosesLogout()">Logout Akun</button>
        <div class="sidebar-footer-author">By : Cip</div>
      </div>
    </aside>

    <!-- KONTEN UTAMA -->
    <main class="main-content">
      <div class="top-header">
        <h1>Manajemen Berita & Artikel</h1>
        <p>Publikasikan kegiatan dan informasi terbaru yayasan ke publik.</p>
      </div>

      <div class="admin-layout">
        
        <!-- FORM INPUT BERITA -->
        <div class="card admin-form-container">
          <h2 id="form-title" style="margin-bottom: 1.25rem; font-size: 1.2rem; font-weight: 700; color: var(--text-dark); letter-spacing: -0.015em;">Tulis Berita Baru</h2>
          
          <form id="form-berita">
            <input type="hidden" id="edit-id" value="">
            <input type="hidden" id="old-image-url" value="">

            <div class="form-field">
              <label for="judul">Judul Berita</label>
              <input type="text" id="judul" placeholder="Contoh: Penyaluran Bansos Ramadhan" required>
            </div>

            <div class="form-field">
              <label for="tanggal">Tanggal Publikasi</label>
              <input type="date" id="tanggal" required>
            </div>

            <div class="form-field">
              <label for="kategori">Kategori</label>
              <select id="kategori" required>
                <option value="Kegiatan">Kegiatan</option>
                <option value="Program">Program</option>
                <option value="Informasi">Informasi</option>
              </select>
            </div>

            <div class="form-field">
              <label for="gambar">Gambar Sampul (Max 2MB)</label>
              <input type="file" id="gambar" accept="image/*" style="padding: 0.6rem; border: 1px dashed #cbd5e1; background: var(--bg-canvas);">
              <img id="img-preview" class="img-preview" src="" alt="Preview">
            </div>

            <div class="form-field">
              <label for="isi">Isi Berita</label>
              <textarea id="isi" required placeholder="Tulis deskripsi berita secara lengkap..." style="min-height: 140px; resize: vertical;"></textarea>
            </div>

            <button type="submit" id="btn-simpan" class="btn btn-primary" style="width: 100%; padding: 0.85rem; margin-top: 0.5rem; background: var(--accent-blue); box-shadow: 0 2px 6px rgba(2, 132, 199, 0.25);">
              Publikasikan Berita
            </button>
            <button type="button" id="btn-batal" class="btn btn-secondary" style="width: 100%; margin-top: 0.5rem; display: none; padding: 0.85rem;">
              Batal Edit
            </button>
          </form>
          <p id="pesan-status" style="margin-top: 1rem; text-align: center; font-size: 0.875rem; font-weight: 600;"></p>
        </div>

        <!-- TABEL DATA BERITA -->
        <div class="card">
          <div style="padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div>
              <h3 style="margin: 0; font-size: 1.05rem; font-weight: 700; color: var(--text-dark); letter-spacing: -0.01em;">Daftar Berita</h3>
            </div>
            <div style="flex-grow: 1; max-width: 300px; width: 100%;">
              <input type="text" id="input-cari" placeholder="Cari judul berita..." style="width: 100%; padding: 0.6rem 0.95rem; border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 0.875rem; background: #ffffff;">
            </div>
          </div>
          
          <!-- Area scroll horizontal khusus tabel -->
          <div class="table-responsive">
            <table class="admin-table" style="min-width: 600px;">
              <thead>
                <tr>
                  <th style="text-align: center; width: 50px;">No</th>
                  <th style="width: 80px;">Sampul</th>
                  <th>Judul & Tanggal</th>
                  <th>Kategori</th>
                  <th style="text-align: center;">Aksi</th>
                </tr>
              </thead>
              <tbody id="tabel-admin-body">
                <tr><td colspan="5" style="padding: 2rem; text-align: center; color: var(--text-muted);">Memuat data...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- LOGIKA MENU MOBILE (HAMBURGER) -->
  <script>
    const btnToggle = document.getElementById('btn-toggle-menu');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    function toggleMenu() {
      sidebar.classList.toggle('active');
      overlay.classList.toggle('active');
    }

    btnToggle.addEventListener('click', toggleMenu);
    overlay.addEventListener('click', toggleMenu);
  </script>

  <script type="module" src="js/auth-guard.js"></script>

  <!-- LOGIKA CRUD & UPLOAD IMGBB -->
  <script type="module">
    import { db, collection, addDoc, getDocs, query, serverTimestamp, doc, updateDoc, deleteDoc } from '../js/firebase-config.js';

    // API KEY IMGBB
    const IMGBB_API_KEY = "0eeb8a2cc63b8f48b7841e72d0a034b3";

    const form = document.getElementById('form-berita');
    const tbody = document.getElementById('tabel-admin-body');
    const pesanStatus = document.getElementById('pesan-status');
    const btnSimpan = document.getElementById('btn-simpan');
    const btnBatal = document.getElementById('btn-batal');
    const inputGambar = document.getElementById('gambar');
    const imgPreview = document.getElementById('img-preview');
    const inputCari = document.getElementById('input-cari');
    
    let dataBeritaMaster = []; 

    const formatTanggal = (tgl) => {
      if (!tgl) return '-';
      const parts = tgl.split('-');
      if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
      return tgl;
    };

    inputGambar.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          imgPreview.src = e.target.result;
          imgPreview.style.display = 'block';
        }
        reader.readAsDataURL(file);
      } else {
        imgPreview.style.display = 'none';
        imgPreview.src = '';
      }
    });

    async function loadDataAdmin() {
      try {
        const q = query(collection(db, 'news'));
        const snap = await getDocs(q);

        if (snap.empty) {
          tbody.innerHTML = `<tr><td colspan="5" style="padding: 2rem; text-align: center; color: var(--text-muted);">Belum ada berita dipublikasikan.</td></tr>`;
          return;
        }

        dataBeritaMaster = []; 
        snap.forEach(doc => {
          const data = doc.data(); data.id = doc.id; dataBeritaMaster.push(data);
        });

        dataBeritaMaster.sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));
        renderTabelAdmin(dataBeritaMaster);

      } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--accent-red);">Gagal memuat data.</td></tr>`;
      }
    }

    function renderTabelAdmin(dataArray) {
      if (dataArray.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="padding: 2rem; text-align: center; color: var(--text-muted);">Data tidak ditemukan.</td></tr>`;
        return;
      }
      let html = ''; let no = 1;
      dataArray.forEach((data) => {
        const bgRow = no % 2 === 0 ? 'var(--bg-canvas)' : '#ffffff';
        const imgSrc = data.imageUrl || 'https://via.placeholder.com/60x60?text=No+Image';

        html += `
          <tr style="border-bottom: 1px solid var(--border); background-color: ${bgRow};">
            <td style="padding: 0.85rem 1rem; text-align: center; color: var(--text-muted); font-size: 0.8rem; font-weight: 600;">${no++}</td>
            <td style="padding: 0.85rem 1rem;">
              <img src="${imgSrc}" class="img-thumbnail" alt="Sampul">
            </td>
            <td style="padding: 0.85rem 1rem;">
              <strong style="color: var(--text-dark); font-size: 0.9rem; line-height: 1.35; display: block;">${data.judul}</strong>
              <span style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; display: inline-block;">${formatTanggal(data.tanggal)}</span>
            </td>
            <td style="padding: 0.85rem 1rem;">
              <span class="badge-kat" style="background: var(--accent-blue-light); color: var(--accent-blue); border-color: rgba(2,132,199,0.25);">${data.kategori}</span>
            </td>
            <td style="padding: 0.85rem 1rem; text-align: center; white-space: nowrap;">
              <button type="button" class="btn-aksi btn-edit" data-id="${data.id}">Edit</button>
              <button type="button" class="btn-aksi btn-hapus" data-id="${data.id}">Hapus</button>
            </td>
          </tr>`;
      });
      tbody.innerHTML = html;
    }

    inputCari.addEventListener('input', (e) => {
      const kata = e.target.value.toLowerCase();
      const hasil = dataBeritaMaster.filter(item => item.judul.toLowerCase().includes(kata));
      renderTabelAdmin(hasil);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      btnSimpan.disabled = true;
      btnSimpan.textContent = 'Mengunggah & Menyimpan...';

      const editId = document.getElementById('edit-id').value;
      const judul = document.getElementById('judul').value;
      const tanggal = document.getElementById('tanggal').value;
      const kategori = document.getElementById('kategori').value;
      const isi = document.getElementById('isi').value;
      const fileGambar = inputGambar.files[0];
      
      let finalImageUrl = document.getElementById('old-image-url').value;

      try {
        if (fileGambar) {
          const formData = new FormData();
          formData.append('image', fileGambar);

          const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
            method: 'POST',
            body: formData
          });

          const dataImgBB = await response.json();
          
          if (dataImgBB.success) {
            finalImageUrl = dataImgBB.data.url;
          } else {
            throw new Error('Gagal mengunggah ke ImgBB: ' + dataImgBB.error.message);
          }
        }

        const dataPayload = { judul, tanggal, kategori, isi, imageUrl: finalImageUrl };

        if (editId === "") {
          dataPayload.createdAt = serverTimestamp();
          await addDoc(collection(db, 'news'), dataPayload);
          pesanStatus.style.color = 'var(--primary)'; pesanStatus.textContent = '✅ Berita berhasil dipublikasikan!';
        } else {
          dataPayload.updatedAt = serverTimestamp();
          await updateDoc(doc(db, 'news', editId), dataPayload);
          pesanStatus.style.color = 'var(--primary)'; pesanStatus.textContent = '✅ Berita berhasil diperbarui!';
          resetForm();
        }

        form.reset(); imgPreview.style.display = 'none'; loadDataAdmin();
        setTimeout(() => { pesanStatus.textContent = ''; }, 3000);

      } catch (error) {
        pesanStatus.style.color = 'var(--accent-red)'; pesanStatus.textContent = '❌ Gagal: ' + error.message;
        console.error(error);
      } finally {
        btnSimpan.disabled = false;
        btnSimpan.textContent = document.getElementById('edit-id').value === "" ? 'Publikasikan Berita' : 'Update Berita';
      }
    });

    tbody.addEventListener('click', async (e) => {
      if (e.target.closest('.btn-edit')) {
        const id = e.target.closest('.btn-edit').getAttribute('data-id');
        const data = dataBeritaMaster.find(item => item.id === id);
        
        document.getElementById('edit-id').value = data.id;
        document.getElementById('judul').value = data.judul;
        document.getElementById('tanggal').value = data.tanggal;
        document.getElementById('kategori').value = data.kategori;
        document.getElementById('isi').value = data.isi;
        document.getElementById('old-image-url').value = data.imageUrl || "";
        
        if(data.imageUrl) {
          imgPreview.src = data.imageUrl;
          imgPreview.style.display = 'block';
        }

        document.getElementById('form-title').textContent = "Edit Berita";
        btnSimpan.textContent = "Update Berita";
        btnBatal.style.display = "block";
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      if (e.target.closest('.btn-hapus')) {
        const id = e.target.closest('.btn-hapus').getAttribute('data-id');
        if (confirm('Yakin ingin menghapus berita ini?')) {
          try {
            await deleteDoc(doc(db, 'news', id)); 
            loadDataAdmin();
          } catch (error) { alert('Gagal menghapus data!'); }
        }
      }
    });

    btnBatal.addEventListener('click', resetForm);
    
    function resetForm() {
      form.reset(); 
      document.getElementById('edit-id').value = "";
      document.getElementById('old-image-url').value = ""; 
      imgPreview.style.display = 'none'; 
      imgPreview.src = '';
      document.getElementById('form-title').textContent = "Tulis Berita Baru";
      btnSimpan.textContent = "Publikasikan Berita"; 
      btnBatal.style.display = "none";
    }

    loadDataAdmin();
  </script>
</body>
</html>
