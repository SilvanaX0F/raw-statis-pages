<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin | Yayasan Padang Wulan</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <style>
    /* === KARTU RINGKASAN STATISTIK === */
    .grid-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .card-stat {
      padding: 1.75rem 1.5rem;
      transition: all 0.2s ease;
    }
    .card-stat:hover {
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }
    .card-stat::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
    }
    .card-stat.donasi::before { background-color: var(--primary); }
    .card-stat.pengeluaran::before { background-color: var(--accent-red); }
    .card-stat.saldo::before { background-color: var(--accent-blue); }
    
    .card-stat h3 {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card-stat .value {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .card-stat.donasi .value { color: var(--primary); }
    .card-stat.pengeluaran .value { color: var(--accent-red); }
    .card-stat.saldo .value { color: var(--accent-blue); }

    @media (max-width: 768px) {
      .grid-summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <!-- HEADER KHUSUS MOBILE -->
  <div class="mobile-header">
    <a href="../index.html" style="display: flex; align-items: center;">
      <img src="../images/log.png" alt="Logo" style="height: 30px;">
    </a>
    <button class="hamburger-btn" id="btn-toggle-menu" aria-label="Buka Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
  </div>

  <!-- OVERLAY GELAP -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="dashboard-layout">
    
    <!-- SIDEBAR NAVIGASI -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <a href="../index.html" style="display: block;">
          <img src="../images/logo-footer-preview.png" alt="Yayasan Padang Wulan">
        </a>
      </div>
      
      <nav class="sidebar-nav">
        <a href="index.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>Ringkasan Utama</a>
        <a href="donasi.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>Kelola Donasi</a>
        <a href="pengeluaran.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>Kelola Pengeluaran</a>
        <a href="berita.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>Kelola Berita</a>
        <a href="galeri.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Kelola Galeri</a>
      </nav>

      <div class="sidebar-footer">
        <button type="button" class="btn-logout" onclick="window.prosesLogout()">Logout Akun</button>
        <div class="sidebar-footer-author">By : Cip</div>
      </div>
    </aside>

    <!-- KONTEN UTAMA -->
    <main class="main-content">
      <div class="top-header">
        <h1>Selamat Datang, Admin!</h1>
        <p>Berikut adalah ringkasan keuangan sistem Yayasan Padang Wulan.</p>
      </div>

      <!-- Ringkasan Statistik -->
      <div class="grid-summary">
        <div class="card card-stat donasi">
          <h3>Total Donasi Masuk</h3>
          <div class="value" id="total-donasi">
            <div class="spinner"></div>
          </div>
        </div>
        
        <div class="card card-stat pengeluaran">
          <h3>Total Penyaluran</h3>
          <div class="value" id="total-pengeluaran">
            <div class="spinner"></div>
          </div>
        </div>
        
        <div class="card card-stat saldo">
          <h3>Saldo Kas Saat Ini</h3>
          <div class="value" id="saldo-kas">
            <div class="spinner"></div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- LOGIKA MENU MOBILE (HAMBURGER) -->
  <script>
    const btnToggle = document.getElementById('btn-toggle-menu');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');

    function toggleMenu() {
      sidebar.classList.toggle('active');
      overlay.classList.toggle('active');
    }

    btnToggle.addEventListener('click', toggleMenu);
    overlay.addEventListener('click', toggleMenu);
  </script>

  <!-- PANGGIL SCRIPT PENJAGA KEAMANAN -->
  <script type="module" src="js/auth-guard.js"></script>

  <!-- LOGIKA PENGHITUNGAN REALTIME -->
  <script type="module">
    import { db, collection, getDocs } from '../js/firebase-config.js';

    const formatRupiah = (angka) => {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0
      }).format(angka);
    };

    async function hitungRingkasanKeuangan() {
      const elDonasi = document.getElementById('total-donasi');
      const elPengeluaran = document.getElementById('total-pengeluaran');
      const elSaldo = document.getElementById('saldo-kas');

      try {
        let totalDonasi = 0;
        const donasiSnap = await getDocs(collection(db, 'donations'));
        donasiSnap.forEach(doc => { totalDonasi += Number(doc.data().jumlah); });

        let totalPengeluaran = 0;
        const pengeluaranSnap = await getDocs(collection(db, 'expenses'));
        pengeluaranSnap.forEach(doc => { totalPengeluaran += Number(doc.data().jumlah); });

        const saldo = totalDonasi - totalPengeluaran;

        elDonasi.textContent = formatRupiah(totalDonasi);
        elPengeluaran.textContent = formatRupiah(totalPengeluaran);
        elSaldo.textContent = formatRupiah(saldo);

      } catch (error) {
        console.error("Gagal mengambil data ringkasan:", error);
        elDonasi.innerHTML = `<span style="font-size:1rem; color:var(--accent-red);">Gagal memuat</span>`;
        elPengeluaran.innerHTML = `<span style="font-size:1rem; color:var(--accent-red);">Gagal memuat</span>`;
        elSaldo.innerHTML = `<span style="font-size:1rem; color:var(--accent-red);">Gagal memuat</span>`;
      }
    }

    hitungRingkasanKeuangan();
  </script>

</body>
</html>
